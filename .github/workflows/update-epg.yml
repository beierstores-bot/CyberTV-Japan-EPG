name: Build CyberTV Japan Master EPG

'on':
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: read

concurrency:
  group: cyberTV-japan-epg
  cancel-in-progress: true

jobs:
  build:
    name: Build Japan Master EPG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build merged XMLTV
        run: python scripts/build_epg.py

      - name: Verify generated EPG files
        run: |
          test -s public/CYBERTV_JAPAN_MASTER.xml.gz
          test -s public/coverage-report.json
          echo "EPG files generated successfully."
          ls -lh public/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy Japan Master EPG
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
